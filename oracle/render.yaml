# render.yaml — Limitless Oracle
# Connect this repo on Render via New → Blueprint
services:
  - type: web
    name: limitless-oracle
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm install && npm run build
    startCommand: npm start

    healthCheckPath: /api/ping

    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NODE_ENV
        value: production

      # ── Set these in Render → Environment tab (never commit real values) ──
      # - key: LIMITLESS_PRIVATE_KEY
      #   value: "0x..."
      # - key: LIMITLESS_TOKEN_ID
      #   value: "..."
      # - key: LIMITLESS_TOKEN_SECRET
      #   value: "..."
