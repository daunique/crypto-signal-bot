# Fly.io config for a headless background worker — no [[services]] or
# [http_service] section on purpose: this app makes outbound connections only
# (Polymarket REST + WebSocket), it doesn't need to accept any inbound traffic.
#
# CHANGE THIS: app names are globally unique across all Fly.io users.
app = "CHANGE-ME-polymarket-momentum-bot"
primary_region = "iad"          # pick the region closest to you: `fly platform regions`
kill_signal = "SIGINT"          # matches the bot's asyncio KeyboardInterrupt shutdown path
kill_timeout = 15               # give the websocket loop time to close cleanly

# Without this, Fly's default policy (on-failure) only restarts a Machine that
# exits with a non-zero code. This bot exits 0 on a graceful SIGINT shutdown —
# which Fly sends routinely (rolling restarts after `secrets set`, etc.) — so
# on-failure leaves it stopped after every single one of those. "always" is
# Fly's own documented recommendation for always-on apps with no [[services]]
# block, which is exactly this app.
[[restart]]
  policy = "always"

[build]
  dockerfile = "Dockerfile"

# Non-sensitive strategy knobs. Fine to keep here since there's nothing secret
# in them — override any of these with `fly secrets set NAME=value` instead if
# you'd rather not have a value visible in fly.toml (secrets win over [env]).
[env]
  BOT_STATE_DIR = "/data"
  K1_SECONDS = "60"
  K2_SECONDS = "90"
  TOL_SECONDS = "5"
  ASSETS = "BTC,ETH,SOL,XRP,BNB,DOGE,HYPE"
  DURATIONS_MIN = "5"
  STAKE_USD = "0.20"
  FALLBACK_MIN_SHARES = "5"
  MAX_TRADES_PER_DAY = "20"
  MAX_DAILY_LOSS_USD = "5.00"
  SKIP_BELOW_MIN_SIZE = "true"

# Everything account-specific and/or genuinely sensitive goes through
# `fly secrets set`, never committed to this file:
#   fly secrets set POLY_PRIVATE_KEY="0x..."
#   fly secrets set POLY_FUNDER_ADDRESS="0x..."     # required for signature_type 1
#   fly secrets set POLY_SIGNATURE_TYPE="1"
#   fly secrets set BOT_MODE="dry-run"              # or "check" / "live"
#   fly secrets set CONFIRM_LIVE_TRADING="I UNDERSTAND THE RISK"   # only for --live

# Persistent storage for trade_log.csv, day_state.json (daily loss circuit
# breaker), and cached API credentials — without this, all three reset to
# empty on every restart/redeploy, which for day_state specifically means
# losing track of whether you already hit today's loss limit.
[mounts]
  source = "polybot_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
