# POLYBOT — Fly.io Configuration
#
# CRITICAL — SINGLE MACHINE ONLY, NOT JUST A PREFERENCE:
# This bot must run as exactly ONE instance, never more. Fly's
# default behavior for apps with an [http_service] section is to
# provision 2 machines for high availability — but running two
# independent bot processes would mean two instances trading
# against the SAME wallet, writing to the SAME SQLite trades.db,
# and each independently deciding capital allocation with no
# awareness of the other. That's not just wasteful, it's actively
# unsafe: duplicate trades, corrupted/conflicting database writes,
# and capital-tracking that no longer reflects reality. This is why
# `fly deploy --ha=false` is REQUIRED (see deployment steps below),
# not optional — deploying without it will silently try to run 2
# machines, and if you also see "requires an unattached
# 'polybot_data' volume" on a SECOND machine, this default 2-machine
# behavior — not a volume creation failure — is almost certainly why.
#
# IMPORTANT: this app also needs to run CONTINUOUSLY (it's a live
# trading bot, not a request/response web service), so
# auto_stop_machines/auto_start_machines below are set to keep it
# always-on. Fly's default free-tier behavior stops idle machines —
# that's fine for a website, but would silently pause your bot
# whenever the dashboard isn't being actively hit, which is NOT
# what you want for a bot that needs to react to WebSocket price
# events in real time regardless of whether anyone's looking at
# the dashboard.

app = "your-polybot-app-name"  # CHANGE THIS — must be globally unique on Fly
primary_region = "lhr"          # London — matches this bot's documented
                                  # latency guidance (close to Polymarket's
                                  # CLOB server). Change only if you have a
                                  # specific reason to prefer elsewhere.

[build]

[env]
  PORT = "5000"

[[mounts]]
  source = "polybot_data"
  destination = "/app/data"
  # If `fly deploy` fails with "requires an unattached 'polybot_data'
  # volume" — this is very likely Fly's default 2-machine HA
  # behavior (see the CRITICAL note at the top of this file), which
  # needs 2 volumes with this same name to satisfy — NOT what you
  # want for this bot, which must only ever run as 1 instance. Fix
  # by deploying with `fly deploy --ha=false` (see README
  # "Troubleshooting" under Fly.io deployment for the full
  # walkthrough), rather than creating a second volume.
  # Persistent volume — trades.db, runtime_settings.json, and the
  # derived API credentials debug mirror all live here. WITHOUT
  # this mount, all of that is wiped on every redeploy/restart,
  # since Fly's container filesystem is otherwise ephemeral.

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false   # Bot must keep running even with no
  auto_start_machines = true    # dashboard traffic — do not let Fly
  min_machines_running = 1      # treat this like an idle website.

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # 512mb is enough for this bot's actual footprint (Flask dashboard
  # + asyncio WebSocket loop + SQLite). Bump to 1gb only if you
  # expand well beyond the current 12 tracked pairs.
