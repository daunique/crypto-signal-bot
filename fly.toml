app = 'crypto-signal-bot-kooj9a'
primary_region = 'ams'

[build]

[env]
  AUTO_TRADE = 'true'
  BOT_MODE = 'demo'
  MARKET_SYMBOL = 'R_25'
  PORT = '8000'
  TIMEFRAME_SECONDS = '180'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
