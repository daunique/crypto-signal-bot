app = "crypto-signal-bot-kooj9a"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  BOT_MODE = "demo"
  MARKET_SYMBOL = "R_25"
  TIMEFRAME_SECONDS = "180"
  AUTO_TRADE = "true"
  BARRIER_ATR_FRACTION = "0.25"
  INVERT_SIGNALS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "bot_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
