app = "replace-with-your-unique-app-name"
primary_region = "ams"

[build]

[env]
  PORT = "8000"
  BOT_MODE = "demo"
  MARKET_SYMBOL = "R_25"
  TIMEFRAME_SECONDS = "180"
  AUTO_TRADE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
