# fly.toml — generated for the CryptoSignal Bot
# Edit `app` to a globally-unique name before first deploy
# (or just run `fly launch` once and let it fill this in).

app = "candle-oracle"            # <-- change to your unique app name
primary_region = "arn"    # <-- pick the fly region closest to you

[build]

[env]
  FLASK_ENV = "production"
  DEFAULT_MODE = "shadow"
  DEFAULT_POSITION_SIZE = "10"
  PORT = "8080"

# This bot runs a scheduler + ML retraining loop in-process and must stay
# running 24/7 — do NOT let Fly auto-stop the machine on idle.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Only needed if you go with SQLite-on-a-volume instead of Postgres.
# 1) fly volumes create btcbot_data --size 1 --region iad
# 2) uncomment below, redeploy
# 3) set DATABASE_URL=sqlite:////data/signals.db as a secret
#
# [mounts]
#   source = "btcbot_data"
#   destination = "/data"
