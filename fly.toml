# ─────────────────────────────────────────────────────────────────────────
# SignalBot — fly.toml
#
# CRITICAL: this app must run as exactly ONE machine, ALWAYS ON.
# APScheduler (in scheduler.py) runs in-process inside the single gunicorn
# worker. If Fly spins up a second machine (autoscaling) or stops this one
# when idle, you get duplicate signal generation and duplicate live orders.
# That's why auto_stop_machines / auto_start_machines are "off" and
# min_machines_running = 1 below. Do not change these without re-architecting
# the scheduler to use a distributed lock.
# ─────────────────────────────────────────────────────────────────────────

app = "btcbot-candle-oracle"   # change to your actual Fly app name
primary_region = "iad"          # pick the region closest to your exchange/DB

[build]

[env]
  PORT = "8080"
  FLASK_ENV = "production"
  DEFAULT_MODE = "shadow"
  DEFAULT_POSITION_SIZE = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # never idle-stop — scheduler must stay alive
  auto_start_machines = false    # don't auto-start a 2nd machine on traffic
  min_machines_running = 1       # always exactly 1 machine running
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[processes]
  app = "gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --timeout 120 --bind 0.0.0.0:8080 wsgi:app"
