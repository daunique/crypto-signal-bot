# Fly.io deployment config for the SignalBot (crypto-signal-bot)
#
# This app runs a long-lived in-process APScheduler (15-min candle signal loop)
# and a Flask-SocketIO websocket dashboard, both inside ONE gunicorn worker
# (-w 1, same as Render). That means:
#   - Do NOT autoscale this app to multiple machines — a second machine would
#     run its own scheduler and double-fire trades/signals.
#   - Do NOT let Fly auto-stop the machine on idle — the scheduler must keep
#     running 24/7 even with no dashboard viewers connected.
#
# Replace "your-app-name" below with the name you choose at `fly launch`,
# and update LIMITLESS_SMART_WALLET / other non-secret values as needed.

app = "your-app-name"
primary_region = "iad"  # change to the region closest to you / your exchange APIs

[build]

[env]
  FLASK_ENV = "production"
  DEFAULT_MODE = "shadow"
  DEFAULT_POSITION_SIZE = "10"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the scheduler alive — do not idle-stop
  auto_start_machines = true
  min_machines_running = 1     # exactly one instance, always on
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
