app = "crypto-signal-bot-kooj9a"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  BOT_MODE = "demo"
  MARKET_SYMBOL = "R_25"
  AUTO_TRADE = "true"
  CONTRACT_DURATION_TICKS = "10"
  BARRIER = "0.30"
  BET_DIRECTION = "LOWER"
  VOL_WINDOW_TICKS = "100"
  VOL_TRAILING_DAYS = "90"
  VOL_TARGET_PERCENTILE = "90.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "bot_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
