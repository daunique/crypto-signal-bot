services:
  - type: web
    name: crypto-signal-bot
    env: python
    pythonVersion: "3.11.9"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/signals.db
      - key: LIMITLESS_API_KEY
        sync: false
      - key: LIMITLESS_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DEFAULT_MODE
        value: shadow
      - key: DEFAULT_POSITION_SIZE
        value: "10"
