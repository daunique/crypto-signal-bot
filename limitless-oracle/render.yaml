# render.yaml
# ─────────────────────────────────────────────────────────────────
# Render Blueprint — deploys Limitless Oracle as a single Web Service.
# Push this file to the root of your GitHub repo and connect it to
# Render via "New → Blueprint" to auto-configure everything.
# ─────────────────────────────────────────────────────────────────

services:
  - type: web
    name: limitless-oracle
    runtime: python
    region: oregon           # change to "frankfurt" or "singapore" if preferred
    plan: free               # upgrade to "starter" ($7/mo) for always-on

    # ── Build ────────────────────────────────────────────────────
    # 1. Install Node + build React → client/dist/
    # 2. Install Python deps
    buildCommand: |
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash - &&
      apt-get install -y nodejs &&
      cd client && npm install && npm run build && cd .. &&
      pip install -r server/requirements.txt

    # ── Start ────────────────────────────────────────────────────
    startCommand: cd server && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120

    # ── Health check (keeps the free plan alive) ─────────────────
    healthCheckPath: /api/ping

    # ── Environment variables (set secrets in Render dashboard) ──
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_ENV
        value: production

      # ── Set these in Render → Environment (never commit real values) ──
      # - key: LIMITLESS_PRIVATE_KEY
      #   value: "0x..."
      # - key: LIMITLESS_TOKEN_ID
      #   value: "..."
      # - key: LIMITLESS_TOKEN_SECRET
      #   value: "..."
      # - key: BASE_RPC_URL
      #   value: "https://mainnet.base.org"
