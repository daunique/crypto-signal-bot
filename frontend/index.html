<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Deriv Higher/Lower Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span class="brand-name">Deriv&nbsp;Bot</span>
    </div>
    <div class="topbar-right">
      <div class="conn" id="connWrap" title="Connection status">
        <span class="conn-dot" id="connDot"></span>
        <span class="conn-label" id="connLabel">&mdash;</span>
      </div>
      <div id="modeBadge" class="mode-badge">DEMO</div>
    </div>
  </header>

  <nav class="appnav" id="appNav" aria-label="Primary">
    <button class="navlink active" data-page="dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="navlink" data-page="signals" aria-label="Signals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,12 7,12 10,19 14,5 17,12 22,12"/></svg>
      <span>Signals</span>
    </button>
    <button class="navlink" data-page="trades" aria-label="Trades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17,1 21,5 17,9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7,23 3,19 7,15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span>Trades</span>
    </button>
    <button class="navlink" data-page="pnl" aria-label="P and L history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,17 9,11 13,15 21,7"/><polyline points="14,7 21,7 21,14"/></svg>
      <span>P&amp;L</span>
    </button>
    <button class="navlink" data-page="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <main class="main">
    <div class="pagebar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="pagesub">R_25 &middot; 10-tick Higher/Lower execution monitor</p>
      </div>
      <div class="controls">
        <button id="startBtn" class="btn btn-primary">Start</button>
        <button id="stopBtn" class="btn btn-danger">Stop</button>
      </div>
    </div>
    <section id="app" class="pagecontent"></section>
  </main>

</div>
<script src="/static/app.js"></script>
</body>
</html>
